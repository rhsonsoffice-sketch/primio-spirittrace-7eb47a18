name: Spirit Trace Build

on:
workflow_dispatch:

jobs:
build:
runs-on: macos-15
steps:
- name: Checkout repository
uses: actions/checkout@v4

- name: Install Flutter
uses: subosito/flutter-action@v2
with:
channel: stable

- name: Get dependencies
run: flutter pub get

- name: Build iOS
run: flutter build ios --release --no-codesign


