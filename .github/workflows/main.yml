name: Spirit Trace iOS Build

on:
workflow_dispatch:
push:
branches:
- main

jobs:
build:
runs-on: macos-15

steps:
- name: Checkout Spirit Trace
uses: actions/checkout@v4

- name: Set up Flutter
uses: subosito/flutter-action@v2
with:
channel: stable

- name: Check Flutter version
run: flutter --version

- name: Resolve dependencies
run: flutter pub get

- name: Build iOS
run: flutter build ios --release --no-codesign

